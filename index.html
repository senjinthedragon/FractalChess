<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FractalChess</title>
<style>
  html,body{margin:0;padding:0;background:#111;color:#ddd;font:13px/1.4 system-ui,sans-serif;overflow:hidden;height:100%;}
  #controls{position:fixed;top:0;left:0;right:0;z-index:10;background:#1b1b1b;border-bottom:1px solid #333;
    padding:8px 10px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;}
  #pieceList{display:flex;flex-direction:column;gap:8px;}
  .pieceRow{display:flex;flex-direction:column;gap:3px;padding-bottom:6px;border-bottom:1px solid #2a2a2a;}
  .pieceHeader{display:flex;gap:6px;align-items:center;}
  .pieceHeader select{background:#222;color:#ddd;border:1px solid #444;}
  .pieceHeader > button{background:#402020;color:#ddd;border:1px solid #663333;cursor:pointer;padding:2px 7px;}
  .col{display:flex;flex-direction:column;gap:4px;}
  button{cursor:pointer;background:#2a2a2a;color:#ddd;border:1px solid #444;padding:4px 8px;border-radius:3px;}
  button:hover{background:#333;}
  select{padding:2px;}
  #stats{white-space:pre;font-family:monospace;color:#8f8;align-self:flex-start;}
  #genPauseBtn{margin-top:8px;}
  canvas{position:fixed;left:0;cursor:grab;touch-action:none;}
  canvas.dragging{cursor:grabbing;}

  .movesetPreview{display:inline-grid;cursor:pointer;border:1px solid #444;background:#0c0c0c;padding:1px;}
  .gridCell{background:#1a1a1a;box-sizing:border-box;border:1px solid #222;}
  .gridCell.origin{background:#555;}
  .gridCell.selected{background:#5ac85a;}
  .gridCell.editable{cursor:pointer;}
  .gridCell.editable:hover{outline:1px solid #8f8;}

  .enemiesBox{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
  .avoidsLabel{color:#888;font-size:11px;}
  .enemySwatch{width:16px;height:16px;padding:0;border-radius:3px;border:2px solid #333;opacity:0.35;}
  .enemySwatch.active{opacity:1;border-color:#eee;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:20;display:flex;align-items:center;justify-content:center;}
  .editorBox{background:#1b1b1b;border:1px solid #444;border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;max-width:90vw;max-height:90vh;overflow:auto;}
  .editorRow{display:flex;gap:10px;align-items:center;justify-content:space-between;}
  .movesetGrid{display:grid;gap:1px;background:#000;padding:2px;align-self:center;}
  #editorText{width:360px;max-width:70vw;background:#111;color:#ddd;border:1px solid #444;font-family:monospace;font-size:12px;}
  .parseIssues{white-space:pre-wrap;color:#e88;font-family:monospace;font-size:11px;max-width:360px;}
</style>
</head>
<body>
<div id="controls">
  <div class="col">
    <div id="pieceList"></div>
    <button id="addPiece">+ Add piece</button>
  </div>
  <div class="col">
    <label>View size
      <select id="texSize">
        <option>128</option><option>256</option><option>512</option>
        <option selected>1024</option><option>2048</option><option>4096</option><option>8192</option>
      </select>
    </label>
    <button id="genPauseBtn">Generate</button>
  </div>
  <div id="stats">loading wasm core...</div>
</div>
<canvas id="glcanvas"></canvas>
<div id="editorOverlay" class="overlay" hidden>
  <div class="editorBox">
    <div class="editorRow">
      <strong>Edit moveset</strong>
      <label>Grid radius <input type="number" id="editorRadius" min="1" max="12" value="3"></label>
    </div>
    <div id="editorGrid" class="movesetGrid"></div>
    <textarea id="editorText" rows="4" placeholder="One move per line: (x, y), x y, x, y, or [x, y]. Prefix with @ to add all symmetries."></textarea>
    <div class="editorRow">
      <button id="editorAddBtn">Add</button>
      <button id="editorDoneBtn">Done</button>
    </div>
    <div id="editorParseIssues" class="parseIssues"></div>
  </div>
</div>

function base64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
let wasm; // raw wasm exports, filled in by boot()
function passArray32(arr){
  const ptr = wasm.__wbindgen_malloc(arr.length*4, 4) >>> 0;
  new Uint32Array(wasm.memory.buffer).set(arr, ptr/4);
  return [ptr, arr.length];
}
const wasmMod = {
  config_reset: () => wasm.config_reset(),
  config_add_piece: (r,g,b,offsets,enemyMask) => {
    const [ptr,len] = passArray32(offsets);
    wasm.config_add_piece(r,g,b,ptr,len,enemyMask);
  },
  start: (texSize) => wasm.start(texSize),
  simulate_batch: (targetRadius,maxTurns) => wasm.simulate_batch(targetRadius,maxTurns) >>> 0,
  target_reached: (targetRadius) => wasm.target_reached(targetRadius) !== 0,
  set_view: (cx,cy,radius) => wasm.set_view(cx,cy,radius),
  redraw: () => wasm.redraw(),
  pixel_ptr: () => wasm.pixel_ptr() >>> 0,
  placed_count: () => wasm.placed_count(),
};

const PIECE_BASE = {
  wazir:      [[1,0],[-1,0],[0,1],[0,-1]],
  ferz:       [[1,1],[1,-1],[-1,1],[-1,-1]],
  dabbaba:    [[2,0],[-2,0],[0,2],[0,-2]],
  alfil:      [[2,2],[2,-2],[-2,2],[-2,-2]],
  dromedary:  [[3,0],[-3,0],[0,3],[0,-3]],
  knight:     expandLeaper(2,1),
  zebra:      expandLeaper(3,2),
  antelope:   expandLeaper(4,3),
};
function expandLeaper(a,b){
  if(a===b) return [[a,a],[a,-a],[-a,a],[-a,-a]];
  if(a===0||b===0){const n=a||b; return [[n,0],[-n,0],[0,n],[0,-n]];}
  return [[a,b],[a,-b],[-a,b],[-a,-b],[b,a],[b,-a],[-b,a],[-b,-a]];
}
function hexToRGB(hex){
  const n = parseInt(hex.slice(1),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function flattenOffsets(offsets){
  const arr = new Int32Array(offsets.length*2);
  offsets.forEach(([dx,dy],i)=>{ arr[i*2]=dx; arr[i*2+1]=dy; });
  return arr;
}

// ---------- state ----------
// Generation happens exactly once per Generate click: the texture is filled
// edge-to-edge (radius texSize/2, native 1:1) plus a thin halo just beyond
// that, sized to the single largest piece offset in play, so that pieces
// right at the texture's edge still see every square that could attack them
// even though it's just outside the visible area (the halo itself is never
// drawn -- it falls outside the pixel bounds naturally). After that, pan and
// zoom are pure screen-space camera moves over the finished texture: no wasm
// calls, no re-rasterizing, no merging cells into pixels.
let wasmExports = null;
let texSize = 1024;
let numPlayers = 0;
let windowRadius = 512;   // texSize/2: the rendered, camera-explorable area
let targetRadius = 512;   // windowRadius + max piece offset (generation-only)
let camZoom = 1;
let panX = 0, panY = 0;   // screen-space camera offset, in pixels
let generating = false;
let paused = false;
let ready = false;

// ---------- WebGL ----------
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl');
let tex, prog, uScaleLoc, uOffsetLoc;
function initGL(){
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, `attribute vec2 p; varying vec2 uv; uniform vec2 uScale; uniform vec2 uOffset; void main(){ uv=(p+1.0)*0.5; uv.y=1.0-uv.y; gl_Position=vec4(p*uScale+uOffset,0.0,1.0);} `);
  gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, `precision mediump float; varying vec2 uv; uniform sampler2D tex; void main(){ gl_FragColor=texture2D(tex,uv);} `);
  gl.compileShader(fs);
  prog = gl.createProgram();
  gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  uScaleLoc = gl.getUniformLocation(prog,'uScale');
  uOffsetLoc = gl.getUniformLocation(prog,'uOffset');
  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  // Plain bilinear only blends a 2x2 texel neighborhood, which still
  // undersamples once zoomed out far enough (moire/uneven pixels). Mipmaps
  // pre-average the texture at each downsampled level so minification
  // actually samples a properly blurred version instead of raw texels.
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
let texAllocSize = 0;
function uploadTexture(){
  const ptr = wasmMod.pixel_ptr();
  const view = new Uint8Array(wasmExports.memory.buffer, ptr, texSize*texSize*4);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if(texAllocSize !== texSize){
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,texSize,texSize,0,gl.RGBA,gl.UNSIGNED_BYTE,view);
    texAllocSize = texSize;
  } else {
    gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,texSize,texSize,gl.RGBA,gl.UNSIGNED_BYTE,view);
  }
  gl.generateMipmap(gl.TEXTURE_2D);
}
function draw(){
  resizeCanvas();
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.02,0.02,0.09,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  const px = texSize*camZoom;
  gl.uniform2f(uScaleLoc, px/canvas.width, px/canvas.height);
  gl.uniform2f(uOffsetLoc, (panX/canvas.width)*2, -(panY/canvas.height)*2);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function resizeCanvas(){
  const barHeight = document.getElementById('controls').offsetHeight;
  const w = window.innerWidth, h = window.innerHeight - barHeight;
  canvas.style.top = barHeight+'px';
  canvas.style.width = w+'px';
  canvas.style.height = h+'px';
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
}
window.addEventListener('resize', ()=>{ resizeCanvas(); draw(); });

// ---------- render loop (drives the one-shot initial generation only) ----------
let loopRunning = false;
function loop(){
  const stillGenerating = !paused && !wasmMod.target_reached(targetRadius);
  if(stillGenerating){
    const t0 = performance.now();
    const budget = 40;
    const chunk = 5000;
    while(performance.now()-t0 < budget && !wasmMod.target_reached(targetRadius)){
      wasmMod.simulate_batch(targetRadius, chunk);
    }
    uploadTexture(); draw(); updateStats();
  }
  if(stillGenerating){
    requestAnimationFrame(loop);
  } else {
    loopRunning = false;
  }
  updateGenPauseBtn();
}
function ensureGenerating(){
  if(!loopRunning && ready){ loopRunning = true; requestAnimationFrame(loop); }
  updateGenPauseBtn();
}
function updateGenPauseBtn(){
  document.getElementById('genPauseBtn').textContent = (loopRunning && !paused) ? 'Stop' : 'Generate';
}
function updateStats(){
  document.getElementById('stats').textContent =
    `placed: ${Math.round(wasmMod.placed_count())}\ncolors: ${numPlayers}`;
}

// ---------- piece list UI ----------
const NAMED = ['knight','wazir','ferz','dabbaba','alfil','dromedary','zebra','antelope','custom'];

function hasOffset(offs,x,y){ return offs.some(([dx,dy])=>dx===x&&dy===y); }

function renderMiniGrid(container, offsets, cellPx){
  container.innerHTML='';
  let r = 2;
  for(const [dx,dy] of offsets) r = Math.max(r, Math.abs(dx), Math.abs(dy));
  r = Math.min(r, 6);
  container.style.gridTemplateColumns = `repeat(${2*r+1}, ${cellPx}px)`;
  for(let y=r; y>=-r; y--){
    for(let x=-r; x<=r; x++){
      const c = document.createElement('div');
      c.className = 'gridCell';
      c.style.width = c.style.height = cellPx+'px';
      if(x===0 && y===0) c.classList.add('origin');
      else if(hasOffset(offsets,x,y)) c.classList.add('selected');
      c.dataset.x = x; c.dataset.y = y;
      container.appendChild(c);
    }
  }
}

function pieceRow(defaultPiece, defaultColor){
  const row = document.createElement('div');
  row.className='pieceRow';
  row._offsets = (PIECE_BASE[defaultPiece]||[]).map(p=>p.slice());
  row._enemies = new Set();

  const header = document.createElement('div');
  header.className='pieceHeader';

  const sel = document.createElement('select');
  for(const n of NAMED){ const o=document.createElement('option'); o.value=n; o.textContent=n[0].toUpperCase()+n.slice(1); sel.appendChild(o); }
  sel.value = defaultPiece;
  sel.addEventListener('change', ()=>{
    if(sel.value!=='custom') row._offsets = PIECE_BASE[sel.value].map(p=>p.slice());
    renderMiniGrid(preview, row._offsets, 4);
  });

  const preview = document.createElement('div');
  preview.className='movesetPreview';
  preview.title = 'Click to edit moveset';
  preview.addEventListener('click', ()=>openEditor(row, sel));
  renderMiniGrid(preview, row._offsets, 4);

  const color = document.createElement('input'); color.type='color'; color.value=defaultColor;
  color.addEventListener('input', refreshAllEnemyUI);

  const rm = document.createElement('button'); rm.textContent='x';
  rm.addEventListener('click', ()=>{ row.remove(); refreshAllEnemyUI(); if(ready){ resizeCanvas(); draw(); } });

  const enemiesBox = document.createElement('div');
  enemiesBox.className='enemiesBox';
  row._enemiesEl = enemiesBox;
  row._colorEl = color;

  header.appendChild(sel); header.appendChild(preview); header.appendChild(color); header.appendChild(rm);
  row.appendChild(header);
  row.appendChild(enemiesBox);
  return row;
}

function refreshAllEnemyUI(){
  const rows = [...pieceList.children];
  for(const row of rows){
    const box = row._enemiesEl;
    box.innerHTML='';
    if(rows.length>1){
      const label = document.createElement('span');
      label.className='avoidsLabel';
      label.textContent='avoids:';
      box.appendChild(label);
    }
    for(const other of rows){
      if(other===row) continue;
      const sw = document.createElement('button');
      sw.className = 'enemySwatch'+(row._enemies.has(other)?' active':'');
      sw.style.background = other._colorEl.value;
      sw.title = row._enemies.has(other) ? 'Avoiding this piece (click to stop)' : 'Not avoiding this piece (click to avoid)';
      sw.addEventListener('click', ()=>{
        if(row._enemies.has(other)) row._enemies.delete(other); else row._enemies.add(other);
        refreshAllEnemyUI();
      });
      box.appendChild(sw);
    }
  }
}

const pieceList = document.getElementById('pieceList');
function addPieceRow(preset, color){
  const row = pieceRow(preset, color);
  const existing = [...pieceList.children];
  pieceList.appendChild(row);
  for(const other of existing){ row._enemies.add(other); other._enemies.add(row); }
  refreshAllEnemyUI();
  if(ready){ resizeCanvas(); draw(); }
  return row;
}
addPieceRow('knight','#000000');
addPieceRow('knight','#cc2222');
document.getElementById('addPiece').addEventListener('click', ()=>{
  const palette = ['#22aacc','#22cc55','#cc8822','#aa22cc','#cccc22','#444444'];
  addPieceRow('knight', palette[pieceList.children.length%palette.length]);
});

// ---------- moveset popup editor ----------
let editingRow = null, editingSelect = null, editorRadius = 3;
const editorOverlay = document.getElementById('editorOverlay');
const editorGrid = document.getElementById('editorGrid');
const editorRadiusInput = document.getElementById('editorRadius');
const editorText = document.getElementById('editorText');
const editorIssues = document.getElementById('editorParseIssues');

function renderEditorGrid(){
  editorGrid.innerHTML='';
  const r = editorRadius;
  editorGrid.style.gridTemplateColumns = `repeat(${2*r+1}, 22px)`;
  for(let y=r; y>=-r; y--){
    for(let x=-r; x<=r; x++){
      const c = document.createElement('div');
      c.className='gridCell editable';
      if(x===0 && y===0){
        c.classList.add('origin');
      } else {
        if(hasOffset(editingRow._offsets,x,y)) c.classList.add('selected');
        c.addEventListener('click', ()=>{
          const idx = editingRow._offsets.findIndex(([dx,dy])=>dx===x&&dy===y);
          if(idx>=0) editingRow._offsets.splice(idx,1); else editingRow._offsets.push([x,y]);
          if(editingSelect) editingSelect.value = 'custom';
          renderEditorGrid();
          renderMiniGrid(editingRow.querySelector('.movesetPreview'), editingRow._offsets, 4);
        });
      }
      editorGrid.appendChild(c);
    }
  }
}
function openEditor(row, sel){
  editingRow = row; editingSelect = sel;
  let r = 3;
  for(const [dx,dy] of row._offsets) r = Math.max(r, Math.abs(dx), Math.abs(dy));
  editorRadius = Math.min(r, 12);
  editorRadiusInput.value = editorRadius;
  editorText.value = '';
  editorIssues.textContent = '';
  renderEditorGrid();
  editorOverlay.hidden = false;
}
editorRadiusInput.addEventListener('input', ()=>{
  editorRadius = Math.min(12, Math.max(1, parseInt(editorRadiusInput.value)||3));
  renderEditorGrid();
});
document.getElementById('editorDoneBtn').addEventListener('click', ()=>{ editorOverlay.hidden = true; });

function parseMoveLine(line){
  let l = line.trim();
  let symmetric = false;
  if(l.startsWith('@')){ symmetric = true; l = l.slice(1).trim(); }
  l = l.replace(/[()\[\]]/g,'');
  const parts = l.split(/[,\s]+/).filter(Boolean);
  if(parts.length !== 2) throw new Error(`can't parse "${line}"`);
  const x = parseInt(parts[0],10), y = parseInt(parts[1],10);
  if(!Number.isFinite(x) || !Number.isFinite(y)) throw new Error(`can't parse "${line}"`);
  if(x===0 && y===0) throw new Error(`(0,0) isn't a valid move`);
  return {x,y,symmetric};
}
document.getElementById('editorAddBtn').addEventListener('click', ()=>{
  const lines = editorText.value.split('\n');
  const issues = [];
  for(let i=0;i<lines.length;i++){
    const raw = lines[i];
    if(!raw.trim()) continue;
    try{
      const {x,y,symmetric} = parseMoveLine(raw);
      const pts = symmetric ? expandLeaper(x,y) : [[x,y]];
      for(const [dx,dy] of pts){
        if(!hasOffset(editingRow._offsets,dx,dy)) editingRow._offsets.push([dx,dy]);
      }
    } catch(err){
      issues.push(`Line ${i+1}: ${err.message}`);
    }
  }
  if(editingSelect) editingSelect.value = 'custom';
  let r = editorRadius;
  for(const [dx,dy] of editingRow._offsets) r = Math.max(r, Math.abs(dx), Math.abs(dy));
  editorRadius = Math.min(r, 12);
  editorRadiusInput.value = editorRadius;
  renderEditorGrid();
  renderMiniGrid(editingRow.querySelector('.movesetPreview'), editingRow._offsets, 4);
  editorIssues.textContent = issues.join('\n');
  editorText.value = '';
});

// ---------- generate / control ----------
function generate(){
  if(!wasmExports) return;
  texSize = parseInt(document.getElementById('texSize').value);
  const rows = [...pieceList.children];
  if(rows.length===0) return;
  wasmMod.config_reset();
  let maxOffset = 0;
  for(const row of rows){
    const [rr,gg,bb] = hexToRGB(row._colorEl.value);
    let mask = 0;
    for(const enemy of row._enemies){
      const j = rows.indexOf(enemy);
      if(j!==-1) mask |= (1<<j);
    }
    wasmMod.config_add_piece(rr,gg,bb, flattenOffsets(row._offsets), mask);
    for(const [dx,dy] of row._offsets) maxOffset = Math.max(maxOffset, Math.abs(dx), Math.abs(dy));
  }
  wasmMod.start(texSize);
  numPlayers = rows.length;
  windowRadius = texSize/2;
  targetRadius = windowRadius + maxOffset;
  panX = 0; panY = 0;
  resizeCanvas();
  camZoom = Math.min(canvas.width, canvas.height) / texSize;

  paused = false;
  uploadTexture(); draw(); updateStats();
  ensureGenerating();
}
document.getElementById('genPauseBtn').addEventListener('click', ()=>{
  if(loopRunning && !paused){
    paused = true;
    updateGenPauseBtn();
  } else {
    generate();
  }
});

// ---------- pan / zoom ----------
let dragging=false, lastX=0, lastY=0;
canvas.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; canvas.classList.add('dragging'); });
window.addEventListener('mouseup', ()=>{ dragging=false; canvas.classList.remove('dragging'); });
window.addEventListener('mousemove', e=>{
  if(!dragging || !ready) return;
  panX += e.clientX-lastX;
  panY += e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  draw();
});
// Zoom by `factor`, keeping whatever texture point is currently under
// screen-pixel (sx,sy) fixed at that same screen position. Wheel zoom
// anchors at screen center; pinch zoom anchors at the pinch midpoint.
function zoomAtPoint(factor, sx, sy){
  const oldZoom = camZoom;
  camZoom = Math.min(200, Math.max(0.02, camZoom*factor));
  const actual = camZoom/oldZoom;
  panX = (sx-canvas.width/2)*(1-actual) + actual*panX;
  panY = (sy-canvas.height/2)*(1-actual) + actual*panY;
}
canvas.addEventListener('wheel', e=>{
  if(!ready) return;
  e.preventDefault();
  const requested = e.deltaY>0 ? 1.15 : 1/1.15;
  zoomAtPoint(requested, canvas.width/2, canvas.height/2);
  draw();
}, {passive:false});

// ---------- touch: one finger pans, two fingers pinch-zoom ----------
let touchMode = null, pinchDist = 0, lastTouch = null;
function touchXY(t){ const r = canvas.getBoundingClientRect(); return {x:t.clientX-r.left, y:t.clientY-r.top}; }
function touchDist(a,b){ return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
canvas.addEventListener('touchstart', e=>{
  if(!ready) return;
  e.preventDefault();
  if(e.touches.length===1){
    touchMode='pan';
    lastTouch = touchXY(e.touches[0]);
  } else if(e.touches.length>=2){
    touchMode='pinch';
    pinchDist = touchDist(e.touches[0], e.touches[1]);
  }
}, {passive:false});
canvas.addEventListener('touchmove', e=>{
  if(!ready || !touchMode) return;
  e.preventDefault();
  if(touchMode==='pan' && e.touches.length===1){
    const p = touchXY(e.touches[0]);
    panX += p.x-lastTouch.x;
    panY += p.y-lastTouch.y;
    lastTouch = p;
    draw();
  } else if(touchMode==='pinch' && e.touches.length>=2){
    const dist = touchDist(e.touches[0], e.touches[1]);
    const mid = touchXY({clientX:(e.touches[0].clientX+e.touches[1].clientX)/2, clientY:(e.touches[0].clientY+e.touches[1].clientY)/2});
    zoomAtPoint(dist/pinchDist, mid.x, mid.y);
    pinchDist = dist;
    draw();
  }
}, {passive:false});
canvas.addEventListener('touchend', e=>{
  if(e.touches.length===1){ touchMode='pan'; lastTouch = touchXY(e.touches[0]); }
  else if(e.touches.length===0){ touchMode=null; }
});

(async function boot(){
  const bytes = base64ToBytes(WASM_B64);
  const imports = { "./wasm_core_bg.js": { __wbindgen_init_externref_table: function(){
    const table = wasm.__wbindgen_externrefs;
    const offset = table.grow(4);
    table.set(0, undefined);
    table.set(offset+0, undefined);
    table.set(offset+1, null);
    table.set(offset+2, true);
    table.set(offset+3, false);
  }}};
  const { instance } = await WebAssembly.instantiate(bytes, imports);
  wasm = instance.exports;
  wasmExports = wasm;
  wasm.__wbindgen_start();
  initGL();
  resizeCanvas();
  ready = true;
  generate();
})();
</script>
